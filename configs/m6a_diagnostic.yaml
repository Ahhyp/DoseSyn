version: m6a-v1
paths:
  logs_dir: outputs/logs
inputs:
  dataset_config: configs/dataset_primary_v1.yaml
  m4_config: configs/m4_training.yaml
outputs:
  runs_dir: outputs/runs/m6a
  metrics_dir: outputs/metrics/m6a
  figures_dir: outputs/figures/m6a
  audit_dir: outputs/audit
training:
  batch_size: 64
  eval_batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip: 5.0
  huber_delta: 1.0
  epochs: 160
  patience: 30
  min_epochs: 5
  num_threads: 4
  amp: false
model:
  hidden_dim: 128
  cell_hidden: 128
  dose_hidden: 64
  decoder_hidden: 256
  gine_layers: 3
  dropout: 0.1
  fourier_bands: 4
runs:
  - model: b3_exact
    scenario: s1_random_condition
    seed: 42
  - model: c0_control
    scenario: s1_random_condition
    seed: 42
  - model: b3sym_scalar
    scenario: s1_random_condition
    seed: 42
  - model: b3sym_fourier
    scenario: s1_random_condition
    seed: 42
  - model: b3sym_film
    scenario: s1_random_condition
    seed: 42
  - model: b3sym_scalar
    scenario: s3_unseen_cell
    fold: 0
  - model: b3sym_fourier
    scenario: s3_unseen_cell
    fold: 0
  - model: b3sym_film
    scenario: s3_unseen_cell
    fold: 0
report:
  open_issues:
    - "M6-A 只做 S1 seed42 / S3 fold0 验证集诊断，不读取 test。"
    - "T0 使用 M4 原始 checkpoint 做推理一致性参照；重训 T0 仍可能有随机差异。"
    - "C0 是 M5 ordered control，不是 B3 复现。"
    - "对称性只保证药物/剂量交换后矩阵转置；不保证与实测单药边界一致。"
