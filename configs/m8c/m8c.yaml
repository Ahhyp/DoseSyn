version: m8c-v1
description: >
  M8-C verification of the frozen ConfSyn-DoseSyn bridge, representative
  dose-surface cases, and chapter-4 integration. Inference-only; no retraining.

paths:
  confsyn_root: /home/kouzheng_2/AH_YeP/confsyn/Consyn
  m1_combo_points: data/processed/oneil_combo_points.parquet
  m8a_evidence: outputs/metrics/m8a/split_matrix_evidence.parquet
  m8b_metrics: outputs/metrics/m8b
  b5_predictions: outputs/runs/m6b/m6b__b5_t3_film_reg__s2_unseen_pair__seed_42/predictions_test.parquet
  b5_checkpoint: outputs/runs/m6b/m6b__b5_t3_film_reg__s2_unseen_pair__seed_42/best.pt
  m3_manifest: outputs/audit/m3_manifest.json
  chapter: docs/paper/chapter4_experiments.md
  outputs_metrics: outputs/metrics/m8c
  outputs_figures: outputs/figures/m8c
  outputs_audit: outputs/audit/m8c
  docs_figures: docs/paper/figures/m8c
  docs_tables: docs/paper/tables

experiment:
  scenario: s2_unseen_pair
  split_id: seed_42
  evidence_level: A
  fold: 0

# Deterministic representative-case rules, fixed before looking at surfaces.
cases:
  top_p: "highest five-fold mean ConfSyn probability"
  median_p: "candidate whose p_mean is closest to the 120-candidate median"
  high_p_high_min: "among p_mean>=0.95, highest predicted surface minimum"
  dual_signal: "among p_mean>=0.9 and y_pred_min<0.2, largest p_mean - y_pred_min"

thresholds:
  high_p: 0.9
  very_high_p: 0.95
  low_x_x0: 0.2
  high_min: 0.35

audit:
  bootstrap_n: 120
  random_state: 0
  stub_perturbation_seed: 7

report:
  title: "M8-C：冻结桥接核验、代表性曲面分析与第四章整合"
