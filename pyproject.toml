[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dosesyn"
version = "0.1.0"
description = "Dose-level drug combination response modelling on O'Neil data (M0/M1: audit & normalization)"
requires-python = ">=3.10"
dependencies = [
    "numpy==1.21.6",
    "pandas==1.3.5",
    "openpyxl==3.1.2",
    "pyarrow==10.0.1",
    "PyYAML==6.0.3",
    "scipy==1.9.3",
]

[project.optional-dependencies]
dev = ["pytest==7.4.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore:Unknown extension is not supported",
    "ignore:Degrees of freedom <= 0 for slice",
    "ignore:Mean of empty slice",
]
